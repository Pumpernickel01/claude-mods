name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The mod API is early access, so the CLI version is pinned.
      - run: npm install -g @anthropic-ai/claude-code@2.1.325
      - name: Shell tests
        run: |
          status=0
          for t in hooks/*/test.sh lib/test_termcap.sh bin/test_*.sh monitor/test.sh statusline/test.sh activity-pane/test.sh; do
            echo "::group::$t"
            bash "$t" || { echo "FAIL $t"; status=1; }
            echo "::endgroup::"
          done
          exit $status
      - name: Mod tests
        run: |
          for m in read-aloud model-guide activity-status session-band gesture-vscode activity-pane; do
            claude plugin test "$m"
          done
      - name: Validate plugin manifest
        run: claude plugin validate .
